# PostgreSQL profile — run against the real database instead of the H2 default.
#
#   docker compose up -d postgres
#   SPRING_PROFILES_ACTIVE=postgres ./mvnw spring-boot:run
#
# Stack it with others as needed:
#   SPRING_PROFILES_ACTIVE=postgres,demo   # real DB, seeded with the demo school
#   SPRING_PROFILES_ACTIVE=prod,postgres   # production
#
# Why this exists: H2's PostgreSQL compatibility mode is an approximation. It has already shaped the
# schema — partial unique indexes (active room names, subject codes, one ACTIVE temporary schedule
# per timetable) were left to service-layer enforcement because H2 cannot express them. Running the
# 35 Flyway migrations against PostgreSQL 16 is the only way to know they actually apply.

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/schediflow}
    username: ${POSTGRES_USER:schediflow}
    password: ${POSTGRES_PASSWORD:schediflow}
    hikari:
      # The solver holds connections while assembling a problem (see deferred-work), so leave a
      # little more headroom than the default 10.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 10000

  jpa:
    properties:
      hibernate:
        jdbc:
          # Lesson generation writes 756 rows in one transaction (SCHED-17); batching keeps that to
          # a handful of round trips rather than 756.
          batch_size: 100
        order_inserts: true
        order_updates: true
