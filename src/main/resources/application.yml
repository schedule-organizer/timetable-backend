spring:
  application:
    name: schediflow-backend

  # Default datasource — H2 in-memory, so a clone runs with no external services.
  # PostgreSQL compat mode approximates BIGSERIAL, JSONB and TIMESTAMP WITH TIME ZONE; it is an
  # approximation, not the real thing, so anything shipping to production should be exercised
  # against PostgreSQL 16 too: SPRING_PROFILES_ACTIVE=postgres (see application-postgres.yml).
  #
  # driver-class-name is deliberately NOT pinned here. Spring infers it from the URL, so overriding
  # SPRING_DATASOURCE_URL alone is enough to point at PostgreSQL. Pinning org.h2.Driver would make
  # every such override fail with a driver mismatch.
  datasource:
    url: jdbc:h2:mem:schediflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  # NOTIF-03: SMTP is opt-in. With SMTP_HOST unset, StubEmailService logs instead of sending,
  # so tests and offline development need no mail server.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Bulk CSV import (RES-11) accepts files up to 5 MB; the service rejects anything larger itself.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns schema management
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  mail:
    # Off by default: StubEmailService logs instead of sending. Set MAIL_ENABLED=true with a real
    # SMTP_HOST (MailHog locally) to activate SmtpEmailService.
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@schediflow.local}
  jwt:
    # Loaded from JWT_SECRET env var. Must be a Base64-encoded key >= 32 bytes.
    # The default below is for local dev only — always override in staging/prod.
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1hdC1sZWFzdC0zMi1ieXRlcw==}
    access-token-expiry-ms: 900000         # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days
  ratelimit:
    max-requests: 10                       # per IP per window
    window-ms: 60000                       # 1 minute
  cors:
    # Comma-separated list of allowed frontend origins. Override via ALLOWED_ORIGINS env var.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  calendarific:
    # Public holiday feed (Calendarific). Required for POST /api/v1/holidays/import.
    api-key: ${CALENDARIFIC_API_KEY:}
    base-url: ${CALENDARIFIC_BASE_URL:https://calendarific.com/api/v2}

# Timefold needs a default bound; SCHED-03 overrides it per job from the requested mode.
timefold:
  solver:
    termination:
      spent-limit: 30s

springdoc:
  api-docs:
    path: /v3/api-docs       # OpenAPI JSON spec
  swagger-ui:
    path: /swagger-ui.html   # Swagger UI
    operations-sorter: alpha
    tags-sorter: alpha
