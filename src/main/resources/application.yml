spring:
  application:
    name: schediflow-backend

  # PostgreSQL 16 — the only database this application supports. Start one with:
  #   docker compose -f docker-compose.services.yml up -d
  #
  # H2 in compatibility mode used to be the default here. It cost more than it saved: two jsonb
  # columns were mapped as varchar, which H2 accepted and PostgreSQL rejects, so registration and
  # custom templates were broken on the real database while the whole suite stayed green.
  #
  # driver-class-name is deliberately NOT pinned. Spring infers it from the URL, so tests can swap
  # in a `jdbc:tc:` Testcontainers URL without a driver mismatch.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/schediflow}
    username: ${POSTGRES_USER:schediflow}
    password: ${POSTGRES_PASSWORD:schediflow}
    hikari:
      # The solver holds a connection while assembling a problem (see deferred-work), so leave a
      # little more headroom than the default 10.
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 10000

  # NOTIF-03: SMTP is opt-in. With SMTP_HOST unset, StubEmailService logs instead of sending,
  # so tests and offline development need no mail server.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Bulk CSV import (RES-11) accepts files up to 5 MB; the service rejects anything larger itself.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns schema management
    show-sql: false
    properties:
      hibernate:
        jdbc:
          # Lesson generation writes 756 rows in one transaction (SCHED-17); batching keeps that to
          # a handful of round trips rather than 756.
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  mail:
    # Off by default: StubEmailService logs instead of sending. Set MAIL_ENABLED=true with a real
    # SMTP_HOST (MailHog locally) to activate SmtpEmailService.
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@schediflow.local}
  jwt:
    # Loaded from JWT_SECRET env var. Must be a Base64-encoded key >= 32 bytes.
    # The default below is for local dev only — always override in staging/prod.
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1hdC1sZWFzdC0zMi1ieXRlcw==}
    access-token-expiry-ms: 900000         # 15 minutes
    refresh-token-expiry-ms: 604800000     # 7 days
  ratelimit:
    max-requests: 10                       # per IP per window
    window-ms: 60000                       # 1 minute
  cors:
    # Comma-separated list of allowed frontend origins. Override via ALLOWED_ORIGINS env var.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  calendarific:
    # Public holiday feed (Calendarific). Required for POST /api/v1/holidays/import.
    api-key: ${CALENDARIFIC_API_KEY:}
    base-url: ${CALENDARIFIC_BASE_URL:https://calendarific.com/api/v2}

# Timefold needs a default bound; SCHED-03 overrides it per job from the requested mode.
timefold:
  solver:
    termination:
      spent-limit: 30s

springdoc:
  api-docs:
    path: /v3/api-docs       # OpenAPI JSON spec
  swagger-ui:
    path: /swagger-ui.html   # Swagger UI
    operations-sorter: alpha
    tags-sorter: alpha
